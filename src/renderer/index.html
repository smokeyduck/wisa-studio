			content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: wisa-wallpaper:; media-src 'self' blob: wisa-wallpaper:; connect-src 'self'; worker-src 'self' blob:"

				background: #f5f4f1;
			}
		</style>
	</head>
