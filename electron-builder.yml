appId: org.wisa.studio
productName: WISA STUDIO
beforePack: scripts/build-browser-use.cjs
afterPack: scripts/after-pack.cjs
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - "!node_modules/**/*"
extraResources:
  - from: resources/omp
    to: omp
  - from: resources/browser-use
    to: browser-use
  - from: resources/browser-use-bridge.py
    to: browser-use-bridge.py
  - from: resources/studio-agent.yml
    to: studio-agent.yml
  - from: .
    to: licenses
    filter: [LICENSE, NOTICE, LICENSE-SCOPE.md, LICENSE-POLYFORM-STRICT]
# `wisa-studio://` deep links only work if LaunchServices sees CFBundleURLTypes, which
# this block is the only thing that writes. Without it `open-url` never fires in
# an installed build and the handler in src/main/deep-link.ts is dead code.
protocols:
  - name: wisa-studio
    schemes:
      - wisa-studio
asar: true
compression: maximum

mac:
  # Keep updater ZIP compression at the normal level; maximum runs 15 Deflate passes.
  compression: normal
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  # Seal the complete bundle even when no Developer ID certificate is available.
  # This preserves macOS's user-override flow instead of presenting the app as damaged.
  identity: "-"
  target:
    # arm64 only here — x64 builds go through electron-builder.x64.yml, which
    # points extraResources at the x86_64 sidecar (resources/omp.x64) instead of
    # the arm64 one below. Building x64 from this config would ship the wrong-arch
    # sidecar.
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: WISA STUDIO uses the microphone for voice dictation in the composer.
    # Electron's stock bundle asks for camera and Bluetooth with text that names no
    # app; WISA STUDIO never calls either API, so the prompt a user might see stays honest.
    NSCameraUsageDescription: WISA STUDIO does not use the camera.
    NSBluetoothAlwaysUsageDescription: WISA STUDIO does not use Bluetooth.
    NSBluetoothPeripheralUsageDescription: WISA STUDIO does not use Bluetooth.
    # Two origins only: the loopback stats server and GitHub releases over TLS.
    # Declaring that is stricter than the default, so an accidental remote
    # cleartext request cannot start working because some build set
    # NSAllowsArbitraryLoads.
    NSAppTransportSecurity:
      NSAllowsArbitraryLoads: false
      NSAllowsLocalNetworking: true
  notarize: false
  # productName carries a space ("WISA STUDIO"), so every artifact name is
  # pinned explicitly: the default would bake the space into the file name and
  # therefore into the release URL and the updater's asset lookup. mac-level
  # `artifactName` covers the zip target — electron-builder 26 has no root
  # `zip:` section (it rejects the whole config with "unknown property 'zip'").
  artifactName: wisa-studio-${version}-${arch}.${ext}

dmg:
  artifactName: wisa-studio-${version}-${arch}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

linux:
  icon: resources/icons
  category: Development
  # Pinned rather than derived from metadata.name: the Linux binary name is
  # part of the installed layout (AppRun BIN, .desktop Exec, StartupWMClass), so
  # a package rename must not silently move it.
  executableName: wisa-studio
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  desktop:
    entry:
      StartupWMClass: wisa-studio

# Root compression "maximum" maps to xz on the FUSE2 toolset, which
# AppImageHub's mounter and some FUSE environments can't open — gzip is the
# canonical AppImage compression.
appImage:
  compression: gzip
  # Without this the name derives from productName and ships as
  # `WISA.STUDIO-0.9.46.AppImage` — a space turned into a dot, which no
  # download link or updater lookup expects.
  artifactName: wisa-studio-${version}.${ext}

# artifactName is pinned for the same reason as the mac/win targets: productName
# carries a space, and the default would embed it.
deb:
  artifactName: wisa-studio_${version}_${arch}.${ext}

publish:
  provider: github
  owner: smokeyduck
  repo: wisa-studio

# NO `electronLanguages` here on purpose — see the note in
# electron-builder.win.yml: exact-basename matching deleted every `locales/*.pak`,
# and the missing `en-US.pak` makes Chromium abort the renderer (issue #12).
