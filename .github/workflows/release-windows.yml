name: Diagnose installed Windows v0.9.52

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-windows-diagnostics:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic script only
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: scripts/diagnose-installed-windows.ps1
          sparse-checkout-cone-mode: false
      - name: Trace exact published NSIS installation and startup
        shell: pwsh
        run: ./scripts/diagnose-installed-windows.ps1
      - name: Retain isolated startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-windows-0952-diagnostics
          retention-days: 7
          path: ${{ runner.temp }}/wisa-installed-diagnostics/evidence