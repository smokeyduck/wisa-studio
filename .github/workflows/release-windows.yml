name: Release Windows builds

# Builds the Windows artifacts (NSIS setup + portable + latest.yml) on
# windows-latest and attaches them to the release. This exists so Windows
# binaries can be produced by CI without a local Windows PC — issue #12's
# blank-window bug shipped for three releases precisely because there was no
# Windows build host to smoke-test on. The bundled sidecar must come from the
# monorepo fork — upstream lacks the GUI-only flags — so this checks out BOTH
# repos: the GUI at the selected ref and the monorepo repository and commit
# recorded in that GUI revision's sidecar-source.json (the same pin
# release-linux.yml uses).
#
# macOS artifacts are built separately by release-macos.yml.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach artifacts to (e.g. v0.9.15)"
        required: true
      gui_ref:
        description: "GUI checkout ref (default: the tag; use main to backfill an old tag)"
        required: false
      monorepo_sha:
        description: "Monorepo commit override (default: sidecar-source.json pin)"
        required: false

permissions:
  contents: write

env:
  GUI_REPO: smokeyduck/wisa-studio

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Resolve release tag
        id: refs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "gui_ref=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "gui_ref=${{ inputs.gui_ref || inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the Core pin from the selected GUI commit
        uses: actions/checkout@v6
        with:
          repository: smokeyduck/wisa-studio
          ref: ${{ steps.refs.outputs.gui_ref }}
          path: gui-pin
          sparse-checkout: sidecar-source.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve the sidecar source
        id: sidecar
        shell: bash
        env:
          MONOREPO_SHA: ${{ inputs.monorepo_sha }}
        run: |
          repo="smokeyduck/oh-my-pi"
          commit="main"
          if [ -f gui-pin/sidecar-source.json ]; then
            # Shape-guard both fields: a malformed pin must fail here, not as a
            # confusing checkout error three steps later.
            repo="$(jq -er '(.repo // "smokeyduck/oh-my-pi") | strings | select(test("^[A-Za-z0-9-]+/[A-Za-z0-9_.-]+$"))' gui-pin/sidecar-source.json)"
            commit="$(jq -er '.commit | strings | select(test("^[a-fA-F0-9]{40}$"))' gui-pin/sidecar-source.json)"
          fi
          # Release binaries build only from the project's own Core repository: a
          # pin naming anywhere else fails the build instead of shipping it.
          if [ "$repo" != "smokeyduck/oh-my-pi" ]; then
            echo "sidecar-source.json names $repo; release sidecars build only from smokeyduck/oh-my-pi" >&2
            exit 1
          fi
          ref="${MONOREPO_SHA:-$commit}"
          if [[ "$ref" == *$'\n'* || "$ref" == *$'\r'* ]]; then
            echo "Invalid monorepo ref" >&2
            exit 1
          fi
          gui_sha="$(git -C gui-pin rev-parse HEAD)"
          printf 'repo=%s\nref=%s\ngui_sha=%s\n' "$repo" "$ref" "$gui_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout the pinned monorepo
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.sidecar.outputs.repo }}
          ref: ${{ steps.sidecar.outputs.ref }}
          path: oh-my-pi
          persist-credentials: false

      - name: Checkout GUI source at the same commit
        uses: actions/checkout@v6
        with:
          repository: smokeyduck/wisa-studio
          ref: ${{ steps.sidecar.outputs.gui_sha }}
          path: oh-my-pi/packages/gui
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The sidecar build requires the monorepo's exact Bun (packageManager),
          # so follow the pinned checkout instead of a hard-coded version.
          bun-version-file: oh-my-pi/package.json

      - name: Install dependencies
        working-directory: oh-my-pi
        run: bun install

      - name: Build natives from the pinned Core source
        working-directory: oh-my-pi
        shell: bash
        env:
          OMP_NATIVE_CARGO_PROFILE: ci
        # npm's same-version addon does not contain fork-only Rust fixes.
        # Windows ships the baseline addon; build:omp reuses this local output.
        run: |
          PI_NATIVE_VARIANT=baseline bun --cwd=packages/natives run build
          test -s packages/natives/native/pi_natives.win32-x64-baseline.node

      - name: Diagnose native DLL dependencies after a failed source build
        if: failure()
        working-directory: oh-my-pi
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          Get-ChildItem packages\natives\native -Filter '*.node' | ForEach-Object { & $dumpbin /nologo /dependents $_.FullName }

      - name: Build the bundled Windows sidecar
        working-directory: oh-my-pi
        run: bun --cwd=packages/gui run build:omp:win

      - name: Smoke-test the sidecar (RPC handshake + settings round-trip)
        working-directory: oh-my-pi/packages/gui
        run: bun scripts/smoke-sidecar.mjs resources/omp.exe

      - name: Verify ru + vi cover every bundled setting
        working-directory: oh-my-pi/packages/gui
        run: bun run check:locale

      - name: Verify sidecar architecture
        shell: pwsh
        working-directory: oh-my-pi/packages/gui
        # Read the PE machine field: a darwin-arm64 binary slipped into a
        # Windows package once and the app never started. `file` isn't shipped
        # with Git Bash on windows runners, so parse the header directly.
        run: |
          $bytes = [IO.File]::ReadAllBytes("resources/omp.exe")
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $name = switch ($machine) {
            0x8664 { "x86-64" }
            0xAA64 { "ARM64" }
            0x014C { "i386" }
            default { "0x{0:X4}" -f $machine }
          }
          Write-Host "sidecar machine: $name"
          if ($machine -ne 0x8664) { Write-Host "::error::sidecar is $name, expected x86-64"; exit 1 }

      # The workflows check out the release tag, so a tag whose packaging config
      # is invalid ships nothing and reports the failure deep in the build log.
      # Validate the config up front instead — electron-builder rejects unknown
      # root keys outright (a stray `zip:` aborted every run once).
      - name: Validate the packaging config before building
        working-directory: oh-my-pi/packages/gui
        shell: bash
        run: |
          node -e '
            const { validateConfiguration } = require("app-builder-lib/out/util/config/config.js");
            const yaml = require("js-yaml");
            const fs = require("fs");
            for (const file of ["electron-builder.yml", "electron-builder.x64.yml", "electron-builder.win.yml"]) {
              const config = yaml.load(fs.readFileSync(file, "utf8"));
              validateConfiguration(config);
              console.log(`${file}: valid`);
            }
          '

      - name: Build GUI + Windows packages
        working-directory: oh-my-pi/packages/gui
        shell: bash
        # NOTE: invoke electron-builder through bun — the bunx shim falls back
        # to Node, which crashes on ESM deps under Node < 22 (see issue #10).
        # The monorepo's bun install hoists deps to the workspace root, so the
        # cli.js lives two levels up, not in packages/gui/node_modules.
        run: |
          bun run build
          bun ../../node_modules/electron-builder/cli.js \
            --config electron-builder.win.yml --win --x64 --publish never

      - name: Verify locale paks shipped (blank-window regression guard)
        working-directory: oh-my-pi/packages/gui
        shell: bash
        # electron-builder's `electronLanguages` option deletes paks whose
        # basename doesn't exactly match — that stripped all 55 and crashed
        # Chromium on Windows (issue #12). The configs must never reintroduce it.
        run: |
          count=$(ls dist/win-unpacked/locales/*.pak 2>/dev/null | wc -l)
          echo "locale paks: $count"
          test "$count" -ge 1
          test -f dist/win-unpacked/locales/en-US.pak

      - name: Verify unpacked, installed NSIS, and portable GUI settings persistence
        working-directory: oh-my-pi/packages/gui
        timeout-minutes: 16
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Resolve the actual product executable; reject an ambiguous unpacked payload.
          $executables = @(Get-ChildItem 'dist\win-unpacked\*.exe' | Where-Object { $_.Name -ne 'omp.exe' })
          if ($executables.Count -ne 1) { throw 'Expected one unpacked GUI executable' }
          node scripts/smoke-packaged-gui.mjs $executables[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Unpacked GUI settings proof failed' }

          $setups = @(Get-ChildItem 'dist\*-setup.exe')
          $portables = @(Get-ChildItem 'dist\*-portable.exe')
          if ($setups.Count -ne 1 -or $portables.Count -ne 1) { throw 'Expected one setup and one portable artifact' }
          $proofRoot = Join-Path $env:RUNNER_TEMP "WISA installer proof Tiếng Việt $([guid]::NewGuid())"
          $installDir = Join-Path $proofRoot 'Installed App'
          New-Item -ItemType Directory -Path $proofRoot | Out-Null

          # /D must be the final, unquoted NSIS argument, including when the path has spaces.
          $start = [Diagnostics.ProcessStartInfo]::new($setups[0].FullName)
          $start.UseShellExecute = $false
          $start.Arguments = "/S /currentuser /D=$installDir"
          $start.Environment.Clear()
          foreach ($name in @('PATH', 'SystemRoot', 'WINDIR', 'COMSPEC', 'PATHEXT', 'TEMP', 'TMP', 'USERPROFILE', 'APPDATA', 'LOCALAPPDATA', 'ProgramFiles', 'ProgramFiles(x86)', 'ProgramData')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($null -ne $value) { $start.Environment[$name] = $value }
          }
          $start.Environment['WISA_PROFILE_ROOT'] = Join-Path $proofRoot 'installer-profile'
          $installer = [Diagnostics.Process]::Start($start)
          if (-not $installer.WaitForExit(300000)) {
            $installer.Kill($true)
            $null = $installer.WaitForExit(10000)
            throw 'NSIS installation exceeded its deadline'
          }
          if ($installer.ExitCode -ne 0) { throw 'NSIS installation failed' }
          $installedExe = Join-Path $installDir $executables[0].Name
          # Check the installed payload against the exact candidate, not a previous installation.
          foreach ($relative in @($executables[0].Name, 'resources\app.asar', 'resources\omp.exe', 'locales\en-US.pak')) {
            $installed = Join-Path $installDir $relative
            $unpacked = Join-Path 'dist\win-unpacked' $relative
            if (-not (Test-Path $installed -PathType Leaf)) { throw 'NSIS payload is incomplete' }
            if ((Get-FileHash $installed).Hash -ne (Get-FileHash $unpacked).Hash) { throw 'NSIS payload differs from candidate' }
          }
          # WScript.Shell can expose the ANSI target of a Unicode shortcut.
          $shell = New-Object -ComObject Shell.Application
          foreach ($folder in @('Desktop', 'Programs')) {
            $directory = [Environment]::GetFolderPath($folder)
            $shortcut = Join-Path $directory 'WISA STUDIO.lnk'
            if (-not (Test-Path $shortcut -PathType Leaf)) { throw 'NSIS shortcut is missing' }
            $target = $shell.NameSpace($directory).ParseName('WISA STUDIO.lnk').GetLink.Path
            if ($target -ne $installedExe) { throw "NSIS shortcut targets the wrong executable: shortcut=[$target] expected=[$installedExe]" }
          }
          node scripts/smoke-packaged-gui.mjs $installedExe
          if ($LASTEXITCODE -ne 0) { throw 'Installed NSIS GUI settings proof failed' }
          # Execute the shipped wrapper: NSIS forwards Playwright's launch flags to its extracted GUI.
          node scripts/smoke-packaged-gui.mjs $portables[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Portable wrapper GUI settings proof failed' }

      - name: Upload Windows assets to the release
        working-directory: oh-my-pi/packages/gui/dist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          # Artifact names are pinned in electron-builder.win.yml
          # (wisa-studio-<version>-setup.exe / -portable.exe); a fixed `omp-*`
          # prefix would upload nothing.
          files=(*-setup.exe *-setup.exe.blockmap *-portable.exe latest.yml)
          test "${#files[@]}" -ge 3
          test -s latest.yml
          compgen -G '*-setup.exe' >/dev/null
          compgen -G '*-portable.exe' >/dev/null
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload "${{ steps.refs.outputs.tag }}" \
            "${files[@]}" --repo "$GUI_REPO" --clobber

      - name: Retain failed Windows runtime binaries
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-failure
          retention-days: 7
          path: |
            oh-my-pi/packages/natives/native/*.node
            oh-my-pi/packages/gui/resources/omp.exe