name: Release Linux builds

# Builds the Linux artifacts (AppImage + deb + latest-linux.yml) on Ubuntu and
# attaches them to the release. The bundled sidecar must come from the monorepo
# fork — upstream lacks the GUI-only flags — so this checks out BOTH repos:
# the GUI at the selected ref and the monorepo repository and commit recorded
# in that GUI revision's sidecar-source.json.

on:
  # Warm the exact pinned Core addons on the default branch; never package on push.
  push:
    branches: [main]
    paths: [sidecar-source.json, .github/workflows/release-linux.yml]
  # Build against a draft; publishing must not enqueue another upload.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach artifacts to (e.g. v0.9.14)"
        required: true
      gui_ref:
        description: "GUI checkout ref (default: the tag; use main to backfill an old tag)"
        required: false
      monorepo_sha:
        description: "Monorepo commit override (default: sidecar-source.json pin)"
        required: false

permissions:
  contents: read

env:
  GUI_REPO: smokeyduck/wisa-studio

jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.refs.outputs.tag }}
      gui_sha: ${{ steps.sidecar.outputs.gui_sha }}
      core_sha: ${{ steps.core.outputs.sha }}
    steps:
      - name: Resolve release tag
        id: refs
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          GUI_REF: ${{ inputs.gui_ref || inputs.tag || github.sha }}
        run: |
          printf 'tag=%s\ngui_ref=%s\n' "$TAG" "$GUI_REF" >> "$GITHUB_OUTPUT"

      - name: Read the Core pin from the selected GUI commit
        uses: actions/checkout@v6
        with:
          repository: smokeyduck/wisa-studio
          ref: ${{ steps.refs.outputs.gui_ref }}
          path: gui-pin
          sparse-checkout: sidecar-source.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve the sidecar source
        id: sidecar
        shell: bash
        env:
          MONOREPO_SHA: ${{ inputs.monorepo_sha }}
        run: |
          repo="smokeyduck/oh-my-pi"
          commit="main"
          if [ -f gui-pin/sidecar-source.json ]; then
            # Shape-guard both fields: a malformed pin must fail here, not as a
            # confusing checkout error three steps later.
            repo="$(jq -er '(.repo // "smokeyduck/oh-my-pi") | strings | select(test("^[A-Za-z0-9-]+/[A-Za-z0-9_.-]+$"))' gui-pin/sidecar-source.json)"
            commit="$(jq -er '.commit | strings | select(test("^[a-fA-F0-9]{40}$"))' gui-pin/sidecar-source.json)"
          fi
          # Release binaries build only from the project's own Core repository: a
          # pin naming anywhere else fails the build instead of shipping it.
          if [ "$repo" != "smokeyduck/oh-my-pi" ]; then
            echo "sidecar-source.json names $repo; release sidecars build only from smokeyduck/oh-my-pi" >&2
            exit 1
          fi
          ref="${MONOREPO_SHA:-$commit}"
          if [[ "$ref" == *$'\n'* || "$ref" == *$'\r'* ]]; then
            echo "Invalid monorepo ref" >&2
            exit 1
          fi
          gui_sha="$(git -C gui-pin rev-parse HEAD)"
          printf 'repo=%s\nref=%s\ngui_sha=%s\n' "$repo" "$ref" "$gui_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout the pinned monorepo
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.sidecar.outputs.repo }}
          ref: ${{ steps.sidecar.outputs.ref }}
          path: oh-my-pi
          persist-credentials: false

      - name: Pin the exact Core commit for all jobs
        id: core
        shell: bash
        working-directory: oh-my-pi
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  natives:
    needs: source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        variant: [baseline, modern]
    steps:
      - name: Checkout the pinned monorepo
        uses: actions/checkout@v6
        with:
          repository: smokeyduck/oh-my-pi
          ref: ${{ needs.source.outputs.core_sha }}
          path: oh-my-pi
          persist-credentials: false

      - name: Cache the source-built ${{ matrix.variant }} addon
        id: native-cache
        uses: actions/cache@v5
        with:
          path: oh-my-pi/packages/natives/native/pi_natives.linux-x64-${{ matrix.variant }}.node
          key: wisa-natives-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant }}-${{ needs.source.outputs.core_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: oh-my-pi/package.json

      - name: Install Core dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        working-directory: oh-my-pi
        run: bun install

      - name: Build ${{ matrix.variant }} natives from the pinned Core source
        if: steps.native-cache.outputs.cache-hit != 'true'
        working-directory: oh-my-pi
        shell: bash
        env:
          OMP_NATIVE_CARGO_PROFILE: ci
          PI_NATIVE_VARIANT: ${{ matrix.variant }}
        run: bun --cwd=packages/natives run build

      - name: Verify the addon loads and reports the pinned version
        working-directory: oh-my-pi
        shell: bash
        env:
          PI_NATIVE_VARIANT: ${{ matrix.variant }}
        run: |
          bun -e '
            import { resolve } from "node:path";
            import { verifyHostAddonLoads } from "./scripts/bazel-natives.ts";
            import { nativesPackageVersion } from "./scripts/stamp-native-version.ts";
            const addon = resolve(`packages/natives/native/pi_natives.linux-x64-${process.env.PI_NATIVE_VARIANT}.node`);
            await verifyHostAddonLoads(addon, undefined, await nativesPackageVersion());
          '

      - name: Stage the native addon for packaging
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: linux-natives-${{ matrix.variant }}
          path: oh-my-pi/packages/natives/native/pi_natives.linux-x64-${{ matrix.variant }}.node
          if-no-files-found: error
          retention-days: 7

  linux:
    if: github.event_name == 'workflow_dispatch'
    needs: [source, natives]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the pinned monorepo
        uses: actions/checkout@v6
        with:
          repository: smokeyduck/oh-my-pi
          ref: ${{ needs.source.outputs.core_sha }}
          path: oh-my-pi
          persist-credentials: false

      - name: Checkout GUI source at the same commit
        uses: actions/checkout@v6
        with:
          repository: smokeyduck/wisa-studio
          ref: ${{ needs.source.outputs.gui_sha }}
          path: oh-my-pi/packages/gui
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The sidecar build requires the monorepo's exact Bun (packageManager),
          # so follow the pinned checkout instead of a hard-coded version.
          bun-version-file: oh-my-pi/package.json

      - name: Install dependencies
        working-directory: oh-my-pi
        run: bun install

      - name: Download both native variants built from the pinned Core
        uses: actions/download-artifact@v4
        with:
          pattern: linux-natives-*
          path: oh-my-pi/packages/natives/native
          merge-multiple: true

      - name: Require both source-built addons before embedding
        working-directory: oh-my-pi
        shell: bash
        run: |
          test -s packages/natives/native/pi_natives.linux-x64-modern.node
          test -s packages/natives/native/pi_natives.linux-x64-baseline.node

      # The workflows check out the release tag, so a tag whose packaging config
      # is invalid ships nothing and reports the failure deep in the build log.
      # Validate the config up front instead — electron-builder rejects unknown
      # root keys outright (a stray `zip:` aborted every run once).
      - name: Validate the packaging config before building
        working-directory: oh-my-pi/packages/gui
        shell: bash
        run: |
          node -e '
            const { validateConfiguration } = require("app-builder-lib/out/util/config/config.js");
            const yaml = require("js-yaml");
            const fs = require("fs");
            for (const file of ["electron-builder.yml", "electron-builder.x64.yml", "electron-builder.win.yml"]) {
              const config = yaml.load(fs.readFileSync(file, "utf8"));
              validateConfiguration(config);
              console.log(`${file}: valid`);
            }
          '

      - name: Build the bundled Linux sidecar
        working-directory: oh-my-pi
        run: bun --cwd=packages/gui run build:omp

      - name: Smoke-test the sidecar (RPC handshake + settings round-trip)
        working-directory: oh-my-pi/packages/gui
        run: bun scripts/smoke-sidecar.mjs resources/omp

      # The settings schema lives in the sidecar, so a Core update that adds a
      # setting silently leaves ru/vi untranslated until this runs against the
      # binary being shipped.
      - name: Verify ru + vi cover every bundled setting
        working-directory: oh-my-pi/packages/gui
        run: bun run check:locale

      - name: Build GUI + Linux packages
        working-directory: oh-my-pi/packages/gui
        # NOTE: invoke electron-builder through bun — the bunx shim falls back
        # to Node, which crashes on ESM deps under Node < 22 (see issue #10).
        # The monorepo's bun install hoists deps to the workspace root, so the
        # cli.js lives two levels up, not in packages/gui/node_modules.
        run: |
          bun run build:browser-use
          bun run build
          bun ../../node_modules/electron-builder/cli.js \
            --config electron-builder.yml --linux AppImage deb --publish never

      - name: Verify unpacked, AppImage, and installed deb runtime
        working-directory: oh-my-pi/packages/gui
        timeout-minutes: 10
        shell: bash
        run: |
          shopt -s nullglob
          appimages=("$PWD"/dist/*.AppImage)
          debs=("$PWD"/dist/*.deb)
          test "${#appimages[@]}" -eq 1
          test "${#debs[@]}" -eq 1
          node scripts/build-browser-use.cjs --verify dist/linux-unpacked/resources/browser-use
          xvfb-run -a node scripts/smoke-packaged-gui.mjs dist/linux-unpacked/wisa-studio
          xvfb-run -a node scripts/smoke-packaged-gui.mjs "${appimages[0]}"
          sudo apt-get install -y "${debs[0]}"
          package=$(dpkg-deb -f "${debs[0]}" Package)
          executable=$(dpkg-query -L "$package" | grep -E '^/opt/.+/wisa-studio$')
          test -x "$executable"
          node scripts/build-browser-use.cjs --verify "$(dirname "$executable")/resources/browser-use"
          xvfb-run -a node scripts/smoke-packaged-gui.mjs "$executable"
          OMP_GUI_TEST_APP="$executable" xvfb-run -a node ../../node_modules/@playwright/test/cli.js test e2e/browser-use.e2e.ts

      - name: Upload Linux assets to the release
        working-directory: oh-my-pi/packages/gui/dist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          shopt -s nullglob
          # Upload every installer the build produced; artifact names are pinned
          # in electron-builder.yml (wisa-studio-*/wisa-studio_*), so globbing a
          # fixed `omp-*` prefix would upload nothing.
          files=(*.AppImage *.AppImage.blockmap *.deb latest-linux.yml)
          test "${#files[@]}" -ge 3
          test -s latest-linux.yml
          compgen -G '*.AppImage' >/dev/null
          compgen -G '*.deb' >/dev/null
          printf 'uploading: %s\n' "${files[@]}"
          sha256sum "${files[@]}"
          gh release upload "$RELEASE_TAG" \
            "${files[@]}" --repo "$GUI_REPO"
